<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完成LP（デモ）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:sans-serif;color:#222}
.page{max-width:480px;margin:0 auto;background:#fff}
.lp-hero img{width:100%;display:block}
.hero-chips{padding:12px 18px 0}.hero-chip{display:inline-block;background:#eef3f8;border-radius:999px;padding:4px 12px;margin:0 8px 8px 0;font-size:13px}
.title-block{background:#173550;padding:34px 30px 38px}
.title-block .lp-sentence{color:#fff;margin:0;line-height:1.7}
.cards{padding:20px 18px 6px}
.card{float:left;width:48%;border-radius:18px;box-shadow:0 4px 16px rgba(23,42,66,.10);padding:16px 14px;margin:0 0 14px}
.card:nth-child(odd){margin-right:4%}
.card-label{font-size:12px;color:#5a6b7d}.card-value{font-size:19px;font-weight:700;margin:2px 0 6px}
.card .lp-sentence{font-size:13px;margin:0;line-height:1.6}
.explain-row{padding:14px 18px 0}
.inline-photo{float:left;width:38%;border-radius:16px}
.explain-text{float:right;width:58%}
.explain-text .lp-sentence{margin:0 0 8px;line-height:1.7}
.details{padding:16px 26px 6px}
.details .lp-sentence{margin:0 0 10px;line-height:1.7}
.clear{clear:both}
.cta{background:#173550;padding:24px 30px 30px;text-align:center;margin-top:18px}
.cta-button{background:#f2762e;color:#fff;border:none;border-radius:999px;padding:14px 44px;font-size:16px;width:56%}
.lp-image img{max-width:100%}
</style>
</head>
<body>
<main class="page">
<section class="lp-hero"><img src="images/hero.webp" alt="hero"><div class="hero-chips"><span class="hero-chip">1,350円</span><span class="hero-chip">07:00〜16:00</span><span class="hero-chip">15,000円</span></div></section>
<section class="title-block"><p class="lp-sentence" data-sentence="3">時給は1,350円です。</p></section>
<section class="cards"><div class="card"><div class="card-label">時給</div><div class="card-value">1,350円</div></div><div class="card"><div class="card-label">勤務時間</div><div class="card-value">07:00〜16:00</div><p class="lp-sentence" data-sentence="4">勤務時間は07:00〜16:00（休憩60分）です。</p></div><div class="card"><div class="card-label">交通費上限</div><div class="card-value">15,000円</div><p class="lp-sentence" data-sentence="6">交通費は実費支給で、月上限15,000円です。</p></div><div class="clear"></div></section>
<section class="explain-row"><img class="inline-photo" src="images/section-work.webp" alt="section-work"><div class="explain-text"></div><div class="clear"></div></section>
<section class="explain-row"><img class="inline-photo" src="images/appeal-A3.webp" alt="appeal-A3"><div class="explain-text"><p class="lp-sentence" data-sentence="5">休日は土日祝日休みです。</p></div><div class="clear"></div></section>
<section class="explain-row"><img class="inline-photo" src="images/appeal-A4.webp" alt="appeal-A4"><div class="explain-text"></div><div class="clear"></div></section>
<section class="explain-row"><img class="inline-photo" src="images/appeal-A5.webp" alt="appeal-A5"><div class="explain-text"><p class="lp-sentence" data-sentence="7">応募資格は未経験可です。</p></div><div class="clear"></div></section>
<section class="details"><p class="lp-sentence" data-sentence="0">仕事内容は物流倉庫での仕分け・検品作業です。</p><p class="lp-sentence" data-sentence="1">勤務地は愛知県豊橋市内の物流倉庫です。</p><p class="lp-sentence" data-sentence="2">雇用形態は有期契約社員で、契約期間は3か月です。</p></section>
<footer class="cta"><button class="cta-button" type="button">応募する</button></footer>
</main>
</body>
</html>
