<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP finished image</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dcdcdc;font-family:sans-serif}
.page{max-width:480px;margin:0 auto;background:#fff;box-shadow:0 0 18px rgba(0,0,0,.18)}
.hero img,.band img{display:block;width:100%;height:auto}
.title-block{background:#173550;padding:34px 30px 38px}
.bar{display:block;height:15px;border-radius:8px;background:#c9d4de;margin:0 0 14px}
.bar:last-child{margin-bottom:0}
.bar-light{background:#e8eef4}
.bar-sm{height:9px;margin:0 0 8px}
.cards{padding:20px 18px 6px}
.card{float:left;width:48%;border:1px solid #e3e7eb;border-radius:12px;padding:16px 14px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-r{float:right}
.card-icon{margin-bottom:8px}
.details{padding:6px 18px 26px}
.detail-card{float:left;width:48%;border:1px solid #e3e7eb;border-radius:12px;padding:14px 12px}
.detail-r{float:right}
.check-row{margin:0 0 11px}
.check-row:last-child{margin-bottom:0}
.check-row .box{display:inline-block;vertical-align:middle;width:15px;height:15px;border:1.6px solid #9aa7b1;border-radius:4px;margin-right:9px}
.check-row .bar{display:inline-block;vertical-align:middle}
.clear{clear:both}
.cta{background:#173550;padding:26px 30px 34px;text-align:center}
.cta-button{display:inline-block;background:#f2762e;border-radius:10px;padding:14px 44px;width:70%}
.bar-cta{background:#ffd9c2;height:13px;margin:0 auto}
</style>
</head>
<body>
<main class="page">
<section class="hero"><img src="images/kv-photos/key-visual.webp" alt=""></section>
<section class="title-block"><span class="bar bar-light" style="width:78%"></span><span class="bar bar-light" style="width:58%"></span><span class="bar bar-light" style="width:42%"></span></section>
<section class="cards"><div class="card"><div class="card-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#173550" stroke-width="1.6"><circle cx="12" cy="12" r="8"/></svg></div><span class="bar bar-sm" style="width:70%"></span><span class="bar bar-sm" style="width:92%"></span><span class="bar bar-sm" style="width:55%"></span></div><div class="card card-r"><div class="card-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#173550" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><span class="bar bar-sm" style="width:70%"></span><span class="bar bar-sm" style="width:92%"></span><span class="bar bar-sm" style="width:55%"></span></div><div class="card"><div class="card-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#173550" stroke-width="1.6"><path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2.4"/></svg></div><span class="bar bar-sm" style="width:70%"></span><span class="bar bar-sm" style="width:92%"></span><span class="bar bar-sm" style="width:55%"></span></div><div class="clear"></div></section>
<section class="band"><img src="images/kv-photos/section-work.webp" alt=""></section>
<section class="details"><div class="detail-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="detail-card detail-r"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<footer class="cta"><span class="cta-button"><span class="bar bar-cta" style="width:46%"></span></span></footer>
</main>
</body>
</html>
