<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP finished image</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:sans-serif}
.page{max-width:480px;margin:0 auto;background:#fff}
.photo-hero{background-size:cover;background-position:center}
.explain-row{padding:16px 18px 0}
.photo-inline{float:left;width:38%;border-radius:16px;background-size:cover;background-position:center}
.explain-card{float:right;width:58%;border:1px solid #e3e7eb;border-radius:14px;padding:14px 12px;box-shadow:0 4px 16px rgba(23,42,66,.08)}
.title-block{background:#1f3d2b;padding:34px 30px 38px}
.bar{display:block;height:15px;border-radius:8px;background:#c9d4de;margin:0 0 14px}
.bar:last-child{margin-bottom:0}
.bar-light{background:#e8eef4}
.bar-sm{height:9px;margin:0 0 8px}
.cards{padding:20px 18px 6px}
.card{float:left;width:48%;border-radius:18px;padding:16px 14px;margin:0 0 14px;box-shadow:0 4px 16px rgba(23,42,66,.10);text-align:center}
.card-r{float:right}
.card-icon{margin-bottom:8px}
.details{padding:6px 18px 26px}
.detail-card{float:left;width:48%;border:1px solid #e3e7eb;border-radius:12px;padding:14px 12px}
.detail-r{float:right}
.check-row{margin:0 0 11px}
.check-row:last-child{margin-bottom:0}
.check-row .box{display:inline-block;vertical-align:middle;width:15px;height:15px;border:1.6px solid #9aa7b1;border-radius:4px;margin-right:9px}
.check-row .bar{display:inline-block;vertical-align:middle}
.clear{clear:both}
.cta{background:#1f3d2b;padding:26px 30px 34px;text-align:center}
.cta-button{display:inline-block;background:#e07b39;border-radius:999px;padding:14px 44px;width:56%}
.bar-cta{background:#ffd9c2;height:13px;margin:0 auto}
</style>
</head>
<body>
<main class="page">
<section class="title-block"><span class="bar bar-light" style="width:78%"></span><span class="bar bar-light" style="width:58%"></span><span class="bar bar-light" style="width:42%"></span></section>
<section class="hero"><div class="photo-hero" style="background-image:url('images/kv-photos/key-visual.webp');height:288px"></div></section>
<section class="explain-row"><div class="photo-inline" style="background-image:url('images/kv-photos/section-work.webp');height:78px"></div><div class="explain-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<section class="explain-row"><div class="photo-inline" style="background-image:url('images/kv-photos/appeal-A2.webp');height:127px"></div><div class="explain-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<section class="explain-row"><div class="photo-inline" style="background-image:url('images/kv-photos/appeal-A3.webp');height:127px"></div><div class="explain-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<section class="explain-row"><div class="photo-inline" style="background-image:url('images/kv-photos/appeal-A4.webp');height:127px"></div><div class="explain-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<section class="explain-row"><div class="photo-inline" style="background-image:url('images/kv-photos/appeal-A5.webp');height:127px"></div><div class="explain-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<section class="details"><div class="detail-card"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="detail-card detail-r"><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div><div class="check-row"><span class="box"></span><span class="bar bar-sm" style="width:68%"></span></div></div><div class="clear"></div></section>
<footer class="cta"><span class="cta-button"><span class="bar bar-cta" style="width:46%"></span></span></footer>
</main>
</body>
</html>
